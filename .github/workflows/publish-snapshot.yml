name: Verify and publish research snapshot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-snapshot.yml
      - scripts/publish_snapshot_release.py
      - docs/RELEASE_ASSETS.json
      - docs/RELEASE_NOTES.md
  workflow_dispatch:
permissions:
  contents: write
  checks: read
concurrency:
  group: publish-research-snapshot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify uploaded hashes and software CI, then publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_snapshot_release.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-publication-proof
          path: results/github_publication/REMOTE_PUBLICATION.json

name: Software tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-perception.lock.txt
      - name: Install headless rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libopengl0
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements-perception.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run software suite
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-results
          path: test-results/pytest.xml
